name: CI Pipeline
'on':
  push:
    branches:
    - ci/feat/sqlite-update-or
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: temurin
jobs:
  grammar_conflicts:
    name: Grammar Choice Conflicts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}
    - name: Check for grammar ambiguities
      run: ./gradlew checkGrammarAmbiguity --no-daemon
    - name: Upload grammar warning report
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: javacc-warnings
        path: build/reports/grammar/
        retention-days: 7
        if-no-files-found: ignore
  gradle_check:
    name: Gradle Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}
    - name: Run Gradle Check
      run: ./gradlew check --no-daemon
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: test-reports-${{ matrix.os }}
        path: 'build/reports/

          build/test-results/

          '
        retention-days: 7
        if-no-files-found: ignore
  maven_verify:
    name: Maven Verify (${{ matrix.os }})
    needs: gradle_check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
        cache: maven
    - name: Run Maven Verify
      run: mvn --batch-mode --no-transfer-progress verify
  gradle_publish:
    name: Gradle Publish (Maven Central)
    needs:
    - gradle_check
    - maven_verify
    if: github.ref == 'refs/heads/master' && github.repository == 'JSQLParser/JSqlParser'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Publish with Gradle
      run: ./gradlew publishToMavenCentral --no-daemon
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.mavenCentralUsername }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.mavenCentralPassword }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.signingInMemoryKey }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.signingInMemoryKeyId }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.signingInMemoryKeyPassword }}
  deploy_docs:
    name: Build & Deploy Sphinx Docs
    needs:
    - gradle_check
    - maven_verify
    if: github.ref == 'refs/heads/master' && github.repository == 'JSQLParser/JSqlParser'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: ${{ env.JAVA_DISTRIBUTION }}
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: .github/requirements-docs.txt
    - name: Install XSLT processor
      run: 'sudo apt-get update

        sudo apt-get install -y --no-install-recommends xsltproc

        '
    - name: Install Python dependencies
      run: 'python -m pip install --upgrade pip

        python -m pip install -r .github/requirements-docs.txt

        '
    - name: Build Sphinx documentation with Gradle
      env:
        FLOATING_TOC: 'false'
      run: ./gradlew -DFLOATING_TOC=false --no-daemon gitChangelogTask renderRR xslt xmldoc sphinx
    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: build/sphinx
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
